name: Build and Release
on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build with Gradle
        run: ./gradlew build

      - name: Release 1.21.11 build
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v0.1.0-1.21.11
          name: defgodqe Meteor Addon v0.1.0 — Minecraft 1.21.11
          body: |
            ## defgodqe Meteor Addon

            Minecraft: **1.21.11**
            Loader: **Fabric**
            Client: **Meteor**

            ### Included
            - Mace Elytra module
            - Automatically equips an Elytra after a mace attack
            - Automatically switches to a Firework Rocket in the hotbar

            ### Installation
            Put the JAR in `%appdata%/.minecraft/mods` alongside the matching Meteor Client and Fabric installation.
          prerelease: false
          files: |
            ./build/libs/*.jar
